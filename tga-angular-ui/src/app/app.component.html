<div class="min-h-screen bg-[#212121] text-zinc-100">
  @if (mobileSidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-black/60 md:hidden"
      aria-label="Close sidebar"
      (click)="closeSidebar()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-[276px] flex-col border-r border-white/8 bg-[#171717] transition-transform duration-200 md:translate-x-0"
    [class.-translate-x-full]="!mobileSidebarOpen()"
  >
    <div class="flex h-14 items-center justify-between px-3">
      <a
        routerLink="/chat"
        class="flex items-center gap-2 rounded-xl px-2 py-1.5 text-sm font-semibold text-zinc-100 hover:bg-white/5"
        (click)="closeSidebar()"
      >
        <span class="grid size-8 place-items-center rounded-lg bg-emerald-500 text-zinc-950">
          <svg lucideBot class="size-4"></svg>
        </span>
        <span>TGA Retrieval Lab</span>
      </a>

      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg text-zinc-400 hover:bg-white/8 hover:text-white md:hidden"
        aria-label="Close sidebar"
        (click)="closeSidebar()"
      >
        <svg lucideX class="size-4"></svg>
      </button>
    </div>

    <div class="px-3 pb-2">
      <a
        routerLink="/chat"
        class="flex h-10 items-center gap-3 rounded-xl border border-white/8 px-3 text-sm text-zinc-200 hover:bg-white/5"
        (click)="closeSidebar()"
      >
        <svg lucidePlus class="size-4"></svg>
        New conversation
      </a>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-2">
      <p class="px-3 pb-1 pt-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-zinc-500">
        Workspace
      </p>

      <a
        routerLink="/chat"
        routerLinkActive="bg-white/8 text-white"
        class="flex h-10 items-center gap-3 rounded-xl px-3 text-sm text-zinc-400 transition hover:bg-white/5 hover:text-white"
        (click)="closeSidebar()"
      >
        <svg lucideMessageSquare class="size-4"></svg>
        Chat
      </a>

      <a
        routerLink="/retrieval-debug"
        routerLinkActive="bg-white/8 text-white"
        class="flex h-10 items-center gap-3 rounded-xl px-3 text-sm text-zinc-400 transition hover:bg-white/5 hover:text-white"
        (click)="closeSidebar()"
      >
        <svg lucideDatabase class="size-4"></svg>
        Retrieval Debug
      </a>
    </nav>

    <div class="border-t border-white/8 p-3">
      <div class="rounded-xl bg-white/[0.035] px-3 py-3">
        <div class="text-xs font-medium text-zinc-300">Development mode</div>
        <div class="mt-1 text-[11px] leading-5 text-zinc-500">
          Mock responses are enabled until FastAPI is connected.
        </div>
      </div>
    </div>
  </aside>

  <div class="min-h-screen md:pl-[276px]">
    <header
      class="sticky top-0 z-20 flex h-14 items-center border-b border-white/7 bg-[#212121]/90 px-3 backdrop-blur-xl md:hidden"
    >
      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg text-zinc-300 hover:bg-white/8"
        aria-label="Open sidebar"
        (click)="mobileSidebarOpen.set(true)"
      >
        <svg lucideMenu class="size-5"></svg>
      </button>
      <span class="ml-2 text-sm font-semibold">TGA Retrieval Lab</span>
    </header>

    <main class="min-h-screen">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
