services:
  - type: web
    name: empty-nn-travel-rag-api
    runtime: python
    rootDir: be
    plan: free
    # Install CPU-only PyTorch first. The default Linux wheel pulls large CUDA
    # packages that are unusable on Render's CPU instances and can exhaust the
    # free-tier build/runtime limits.
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -r requirements-deploy.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: travel-rag-postgres
          property: connectionString
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: USER_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: RERANKER_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: travel-rag-postgres
    databaseName: travel_rag
    user: travel_rag
    plan: free
